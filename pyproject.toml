[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "long-items-recommendation"
version = "0.1.0"
description = "Auditable reconstruction of SAET Round 3 item-to-user recommendation experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2", "scipy>=1.14", "scikit-learn>=1.6", "pandas>=2.2", "joblib>=1.4", "torch>=2.6"]

[project.optional-dependencies]
test = ["pytest>=8"]
report = ["matplotlib>=3.9", "python-docx>=1.1"]

[tool.setuptools.packages.find]
include = ["saet_repro*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
